<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ログイン</title>
</head>
<body>

<h1>ログイン</h1>

<form th:action="@{/login}" method="post">

    <div>
        メール：
        <input type="text" name="email">
    </div>
    <br>
    <div>
        パスワード：
        <input type="password" name="password">
    </div>
    <br>
    <button type="submit">ログイン</button>
</form>

<p style="color:red;" th:text="${error}"></p>

<br>
<a th:href="@{/users/add}">新規登録</a>

</body>
</html>
