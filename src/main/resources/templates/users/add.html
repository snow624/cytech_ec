<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>新規登録</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div id="page-style">
<h1>ユーザー新規登録</h1>

<form th:action="@{/users/add}" th:object="${userForm}" method="post">
	
	<!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /> -->
	
<div class="text">
	<input type="text" th:field="*{userName}" placeholder="ユーザー名">
	<p class="error" th:if="${#fields.hasErrors('userName')}" th:errors="*{userName}"></p>
	</div>

	<div class="text">
	<input type="text" th:field="*{email}" placeholder="メールアドレス">
	<p  class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></p>
	</div>

	<div class="text">
	<input type="password" th:field="*{password}" placeholder="パスワード">
	<p class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}" ></p>
	</div>
	
	<div class="text">
	<input type="password" th:field="*{passwordConfirm}" placeholder="パスワード(確認)">
	<p class="error" th:if="${#fields.hasErrors('passwordConfirm')}" th:errors="*{passwordConfirm}"></p>
	</div>	

    
	<div class="btn-wrap"> <button type="submit" class="login-btn">登録</button></div>
</form>

<a th:href="@{/login}"><div class="btn-wrap"><button type="submit" class="back-btn">戻る</button></div></a>

</div>

</body>
</html>
