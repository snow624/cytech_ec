<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>住所登録</title>
	<link rel="stylesheet" th:href="@{/css/style.css}">
				<!--icon-->
				<link rel="stylesheet"
				      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
					  <!--fonts awesome-->
					      <link rel="stylesheet"
					           href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
					          integrity="sha512-p6H1mF+0Jr5E2lZQ+..."
					          crossorigin="anonymous" referrerpolicy="no-referrer" />
							  <!--google fonts-->
							  <link rel="preconnect" href="https://fonts.googleapis.com">
							  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
							  <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=DotGothic16&family=M+PLUS+Rounded+1c:wght@400;500;700&family=Noto+Sans+JP:wght@100..900&family=Noto+Serif+JP:wght@200..900&family=Rampart+One&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
							  				  
</head>

<body>
	<th:block th:replace="common/header :: header"></th:block>
	
	<div id="page-style">
<h2>配送先住所を追加</h2>

<form th:action="@{/address/add}" method="post">
    
    <p>都道府県：<input type="text" name="prefecture" required></p>
    <p>市区町村：<input type="text" name="city" required></p>
    <p>番地・建物名：<input type="text" name="detail" required></p>
    

    <div class="btn-wrap"><button type="submit" class="new-btn">登録する</button></div>
</form>

<a th:href="@{/address/list}"> <div class="btn-wrap"><button class="back-btn">戻る</button></div> </a>
	</div>
</body>
</html>
